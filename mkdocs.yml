site_name: Microserver
site_description: Financial SI Standard Framework & Reference Architecture
docs_dir: docs

theme:
  name: material
  language: ko

  features:
    - navigation.tabs
    - navigation.top
    - navigation.prune
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - assets/css/extra.css


plugins:
  - search
  - redirects:
      redirect_maps:
        index.md: 01_project_start/01_overview/project_introduction.md
        
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
#  - Home: index.md

  - 프로젝트 시작:
      - 프로젝트 이해:
          - 프로젝트 소개: 01_project_start/01_overview/project_introduction.md
          - 구축 목표: 01_project_start/01_overview/project_goal.md
          - 프로젝트 로드맵: 01_project_start/01_overview/project_roadmap.md
          - 아키텍처 방향: 01_project_start/01_overview/architecture_direction.md

      - 프로젝트 환경 구성:
          - 개발 장비 구성: 01_project_start/02_environment/development_device.md
          - Git / GitHub 환경 구성: 01_project_start/02_environment/git_github_setup.md
          - Python / MkDocs:
              - Windows 환경 구성: 01_project_start/02_environment/python_mkdocs/windows_python_venv_mkdocs.md
              - macOS 환경 구성: 01_project_start/02_environment/python_mkdocs/macos_python_venv_mkdocs.md
          - Java 개발환경:
              - JDK 설치 및 설정: 01_project_start/02_environment/java/jdk_setup.md
              - VS Code 개발환경 구성: 01_project_start/02_environment/java/vscode_setup.md
              - Maven 설치 및 설정: 01_project_start/02_environment/java/maven_setup.md
          - Database 개발환경:
              - Oracle / Docker 로컬 환경: 01_project_start/02_environment/database/oracle_docker_setup.md

      - 프로젝트 생성:
          - Spring Boot 프로젝트 생성: 01_project_start/03_project_creation/spring_boot_project_create.md
          - Maven 기본 구조: 01_project_start/03_project_creation/maven_project_structure.md
          - Package 구조 설계: 01_project_start/03_project_creation/package_structure.md
          - application.yml 기본 설정: 01_project_start/03_project_creation/application_yaml.md
          - 프로젝트 최초 실행: 01_project_start/03_project_creation/first_run.md

  - Framework 구축:
      - 프로젝트 공통 구조:
          - module-common 구성: 02_framework/01_project_structure/module_common.md
          - runtime 모듈 구성: 02_framework/01_project_structure/runtime_module.md
          - admin 모듈 구성: 02_framework/01_project_structure/admin_module.md
          - 멀티모듈 프로젝트 구조: 02_framework/01_project_structure/multi_module_structure.md

      - 공통 Framework:
          - 공통 Response 구조: 02_framework/02_common_framework/common_response.md
          - 공통 예외 처리: 02_framework/02_common_framework/exception_handling.md
          - Logging 구성: 02_framework/02_common_framework/logging.md
          - Filter 구성: 02_framework/02_common_framework/filter.md
          - 공통 Utility 구성: 02_framework/02_common_framework/utility.md
          - Jasypt 설정: 02_framework/02_common_framework/jasypt.md

      - Database:
          - Oracle 연동: 02_framework/03_database/oracle_connection.md
          - DataSource 구성: 02_framework/03_database/datasource.md
          - MyBatis 구성: 02_framework/03_database/mybatis.md
          - Transaction 관리: 02_framework/03_database/transaction.md
          - Multi DataSource 구성: 02_framework/03_database/multi_datasource.md

      - Security:
          - Spring Security 기본 구성: 02_framework/04_security/spring_security.md
          - 사용자 관리: 02_framework/04_security/user_management.md
          - Role / 권한 모델: 02_framework/04_security/role_management.md
          - 사용자 인증: 02_framework/04_security/authentication.md
          - 인가 및 접근 제어: 02_framework/04_security/authorization.md

      - API 개발 표준:
          - Controller 개발 표준: 02_framework/05_api/controller.md
          - Service 개발 표준: 02_framework/05_api/service.md
          - Repository / Mapper 개발 표준: 02_framework/05_api/repository.md
          - Validation: 02_framework/05_api/validation.md
          - OpenAPI / Swagger: 02_framework/05_api/openapi_swagger.md

  - 업무 및 금융 연계:
      - 업무 공통:
          - 공통코드: 03_business_financial/01_business_common/common_code.md
          - 메뉴 관리: 03_business_financial/01_business_common/menu.md
          - 사용자 관리 기능: 03_business_financial/01_business_common/user.md
          - 게시판 공통 기능: 03_business_financial/01_business_common/board.md
          - 관리자 기능: 03_business_financial/01_business_common/admin.md

      - 금융 시스템 연계:
          - 전문 구조: 03_business_financial/02_financial_integration/message_structure.md
          - Message Builder: 03_business_financial/02_financial_integration/message_builder.md
          - Message Parser: 03_business_financial/02_financial_integration/message_parser.md
          - MCA 연계: 03_business_financial/02_financial_integration/mca.md
          - EAI 연계: 03_business_financial/02_financial_integration/eai.md
          - FEP 연계: 03_business_financial/02_financial_integration/fep.md

  - 확장 아키텍처:
      - WebClient: 04_extended_architecture/webclient.md
      - Spring Cloud Gateway: 04_extended_architecture/spring_cloud_gateway.md
      - Spring WebFlux: 04_extended_architecture/webflux.md
      - Service Discovery / Eureka: 04_extended_architecture/eureka.md
      - Kubernetes: 04_extended_architecture/kubernetes.md

  - 참고자료:
