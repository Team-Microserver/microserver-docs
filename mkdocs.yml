site_name: MicroServer 구축 가이드
site_description: 금융 SI 프로젝트를 위한 Spring Boot 기반 MicroServer 표준 Framework 구축 및 운영 가이드
site_author: Team MicroServer
docs_dir: docs

theme:
  name: material
  language: ko

  # 항상 Dark Theme 사용
  # OS / Browser의 Light/Dark 설정과 관계없이 slate scheme으로 고정한다.
  # Toggle을 제공하지 않으므로 사이트는 항상 Dark 상태로 표시된다.
  palette:
    scheme: slate
    primary: indigo
    accent: light-blue

  features:
    - navigation.tabs
    - navigation.top
    - navigation.prune
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/toc-toggle.js

  

plugins:
  - search:
      lang: ko
  - redirects:
      redirect_maps:
        index.md: 01_project_start/01_overview/project_introduction.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

